name: Python baseline
on:
  workflow_call:
    inputs:
      baseline-ref:
        required: true
        type: string
      nix-shell:
        description: Flake shell in the caller repository providing the test and mutation Python environment
        required: true
        type: string
      mutation:
        default: false
        type: boolean
      lint-base-sha:
        default: ''
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.mutation && 360 || 90 }}
    env:
      IFRL_LINT_BASE_SHA: ${{ inputs.lint-base-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heartpunk/ifrl
          ref: ${{ inputs.baseline-ref }}
          path: .ifrl-ci
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
            max-jobs = 2
            cores = 2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ifrl
          skipPush: true
      - name: Prepare public dependency access
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
          mkdir -p ci-reports
          git rev-parse HEAD > ci-reports/revision.txt
          git -C .ifrl-ci rev-parse HEAD > ci-reports/baseline-revision.txt
      - name: Restore mutation progress for this source and baseline
        if: inputs.mutation
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-mutation-cache
          key: mutation-${{ github.sha }}-${{ hashFiles('.ifrl-ci/ci/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mutation-${{ github.sha }}-${{ hashFiles('.ifrl-ci/ci/**') }}-
      - name: Prepare native test inputs
        id: prepare
        run: |
          if test -f .ci/python-prepare.sh; then
            nix develop '${{ inputs.nix-shell }}' --no-write-lock-file --command bash .ci/python-prepare.sh
          fi
      - name: Lint Python
        if: ${{ !inputs.mutation }}
        run: nix develop '${{ inputs.nix-shell }}' --no-write-lock-file --command python3 .ifrl-ci/ci/python.py lint
      - name: Run existing tests with branch and subprocess coverage
        if: ${{ !cancelled() && !inputs.mutation && steps.prepare.outcome == 'success' }}
        run: |
          if test -f .ci/python-coverage.sh; then
            nix develop '${{ inputs.nix-shell }}' --no-write-lock-file --command bash .ci/python-coverage.sh
          else
            nix develop '${{ inputs.nix-shell }}' --no-write-lock-file --command python3 .ifrl-ci/ci/python.py coverage
          fi
      - name: Attempt exhaustive mutation testing within the daily budget
        if: inputs.mutation
        run: nix develop '${{ inputs.nix-shell }}' --no-write-lock-file --command python3 .ifrl-ci/ci/python.py mutation
      - name: Save mutation progress
        if: ${{ !cancelled() && inputs.mutation }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-mutation-cache
          key: mutation-${{ github.sha }}-${{ hashFiles('.ifrl-ci/ci/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve Python reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ inputs.mutation && 'mutation' || 'branch-coverage' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports
          retention-days: 90
          if-no-files-found: error
