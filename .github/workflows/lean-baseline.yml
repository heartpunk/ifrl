name: Lean baseline
on:
  workflow_call:
    inputs:
      baseline-ref:
        required: true
        type: string
      nix-shell:
        default: '.'
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: heartpunk/ifrl
          ref: ${{ inputs.baseline-ref }}
          path: .ifrl-ci
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
            max-jobs = 2
            cores = 2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ifrl
          skipPush: true
      - name: Build, test, and audit the pinned Lean project
        env:
          NIX_SHELL: ${{ inputs.nix-shell }}
        run: |
          mkdir -p ci-reports/lean
          git rev-parse HEAD > ci-reports/lean/revision.txt
          git -C .ifrl-ci rev-parse HEAD > ci-reports/lean/baseline-revision.txt
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
          nix flake check --no-write-lock-file 2>&1 | tee ci-reports/lean/flake.log
          nix develop "$NIX_SHELL" --no-write-lock-file \
            --command bash -euo pipefail .ci/lean.sh 2>&1 | tee ci-reports/lean/build-and-audit.log
          if grep -w sorryAx ci-reports/lean/build-and-audit.log; then
            echo 'Proof audit found sorryAx' >&2
            exit 1
          fi
      - name: Preserve Lean build and proof-audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports/lean
          retention-days: 90
          if-no-files-found: error
