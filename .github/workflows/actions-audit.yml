name: GitHub Actions audit
on:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the reusable workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ifrl-audit
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ github.token }}
      - name: Audit workflow syntax and shell commands
        run: |
          mkdir -p ci-reports/actions
          # The locked actionlint predates GitHub's reusable-workflow identity fields.
          # Keep checking all other expressions until the tool recognizes them.
          nix shell ./.ifrl-audit#actionlint --no-write-lock-file \
            --command actionlint -ignore 'unexpected key "queue" for "concurrency" section' \
              -ignore 'property "workflow_(repository|sha)" is not defined' \
            .github/workflows/*.yml 2>&1 | tee ci-reports/actions/actionlint.txt
      - name: Audit workflow security
        if: ${{ !cancelled() }}
        run: |
          mkdir -p ci-reports/actions
          python -m pip install -r .ifrl-audit/ci/requirements.txt
          zizmor --offline --format sarif .github > ci-reports/actions/zizmor.sarif
      - name: Preserve GitHub Actions audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actions-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports/actions
          retention-days: 90
          if-no-files-found: error
