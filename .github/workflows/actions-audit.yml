name: GitHub Actions audit
on:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
      - name: Audit workflow syntax and shell commands
        run: |
          mkdir -p ci-reports/actions
          # Use the suite's pinned nixpkgs rather than a floating tool release.
          nix shell github:NixOS/nixpkgs/e7a3ca8092b61ff85b6a45bf863ea2b2d6a661b3#actionlint \
            --command actionlint -ignore 'unexpected key "queue" for "concurrency" section' \
            .github/workflows/*.yml 2>&1 | tee ci-reports/actions/actionlint.txt
      - name: Audit workflow security
        if: ${{ !cancelled() }}
        run: |
          mkdir -p ci-reports/actions
          python -m pip install zizmor==1.31.1
          zizmor --offline --format sarif .github > ci-reports/actions/zizmor.sarif
      - name: Preserve GitHub Actions audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actions-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports/actions
          retention-days: 90
          if-no-files-found: error
