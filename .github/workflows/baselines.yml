name: Suite CI baselines
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  baselines:
    uses: ./.github/workflows/suite-baselines.yml
    with:
      baseline-ref: ${{ github.sha }}
      python-nix-shell: ''
      lean-nix-shell: ''
