name: Suite CI baselines
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mutation:
        description: Run the bounded daily mutation campaign
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  python:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/python-baseline.yml # zizmor: ignore[self-repository] -- pinned actionlint does not yet support $/
    with:
      baseline-ref: ${{ github.sha }}
  mutation:
    if: github.event_name == 'schedule' || inputs.mutation == true
    uses: ./.github/workflows/python-baseline.yml # zizmor: ignore[self-repository] -- pinned actionlint does not yet support $/
    with:
      baseline-ref: ${{ github.sha }}
      mutation: true
  actions:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/actions-audit.yml # zizmor: ignore[self-repository] -- same-commit reusable workflow
